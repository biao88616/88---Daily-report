<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日数据报告汇总 - Daily Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 750px; margin: 40px auto; padding: 20px; background-color: #f6f8fa; color: #24292e; }
        h1 { border-bottom: 2px solid #0366d6; padding-bottom: 12px; font-size: 24px; margin-bottom: 8px; }
        h2 { font-size: 14px; color: #586069; font-weight: normal; margin-top: 0; margin-bottom: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #ffffff; margin: 12px 0; padding: 16px 20px; border-radius: 8px; border: 1px solid #e1e4e8; transition: box-shadow 0.2s; }
        li:hover { box-shadow: 0 3px 8px rgba(0,0,0,0.08); }
        a { text-decoration: none; color: #0366d6; font-weight: 600; font-size: 17px; display: block; }
        a:hover { text-decoration: underline; }
        .loading { color: #586069; font-style: italic; }
    </style>
</head>
<body>
    <h1>📊数据核对监控看板 - Daily Report Data Dashboard</h1>
    <h2>每日数据自动核对与报告汇总列表, 点击下方链接查看详情</h2>
    <ul id="report-list">
        <li class="loading">正在加载报告列表...</li>
    </ul>

    <script>
        const username = 'biao88616';
        const repo = '88---Daily-report';
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(files => {
                const list = document.getElementById('report-list');
                list.innerHTML = '';
                
                // Lọc các file .html, loại trừ file index.html và sắp xếp mới nhất lên trên
                const htmlFiles = files
                    .filter(file => file.name.endsWith('.html') && file.name !== 'index.html')
                    .sort((a, b) => b.name.localeCompare(a.name));

                if (htmlFiles.length === 0) {
                    list.innerHTML = '<li>暂无报告 (Chưa có báo cáo nào)</li>';
                    return;
                }

                htmlFiles.forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = encodeURIComponent(file.name);
                    a.textContent = '📄 ' + file.name.replace('.html', '');
                    li.appendChild(a);
                    list.appendChild(li);
                });
            })
            .catch(error => {
                document.getElementById('report-list').innerHTML = '<li>加载列表失败，请稍后刷新重试。</li>';
            });
    </script>
</body>
</html>
